[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Public VITE_* vars are intentionally inlined into the browser bundle by Vite.
  # Listing them here tells Netlify's Secrets Scanner they are not secrets.
  # NEVER add server-only keys (e.g. SUPABASE_SERVICE_ROLE_KEY) to this list.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_GAS_WEBHOOK_URL,VITE_ADMIN_EMAIL"

  # The compiled dist/ folder contains the public VITE_* vars above — that is expected.
  SECRETS_SCAN_OMIT_PATHS = "dist/**"

[functions]
  directory = "netlify/functions"
